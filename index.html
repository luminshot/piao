<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小票来了 · 你口袋里的数字打印机</title>
<meta name="description" content="小票来了 —— 你口袋里的数字打印机">
<meta name="theme-color" content="#F3EEE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小票来了">
<link rel="apple-touch-icon" href="assets/app-icon-180.png">
<link rel="icon" href="assets/app-icon-180.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <img src="assets/logo-mark.svg" width="32" height="32" alt="">
      </span>
      <div class="brand-txt">
        <h1>小票来了</h1>
        <p>你口袋里的数字打印机</p>
      </div>
    </div>
    <div class="top-tools">
      <button class="icon-btn" id="btn-clip" aria-label="票夹">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M3.5 7.5a1.75 1.75 0 0 1 1.75-1.75h4.3l1.8 1.9h7.4A1.75 1.75 0 0 1 20.5 9.4v8.1a1.75 1.75 0 0 1-1.75 1.75H5.25A1.75 1.75 0 0 1 3.5 17.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M3.8 9.2h16.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".65"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="设置">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M10 2.9h4l.55 2.05a7.3 7.3 0 0 1 1.45.84l2.02-.67 2 3.46-1.46 1.55a7.5 7.5 0 0 1 0 1.68l1.46 1.55-2 3.46-2.02-.67a7.3 7.3 0 0 1-1.45.84L14 19.1h-4l-.55-2.05A7.3 7.3 0 0 1 8 16.21l-2.02.67-2-3.46 1.46-1.55a7.5 7.5 0 0 1 0-1.68L3.98 8.64l2-3.46L8 5.85a7.3 7.3 0 0 1 1.45-.84z" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/>
          <circle cx="12" cy="11.5" r="2.65" fill="none" stroke="currentColor" stroke-width="1.45"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="machine-wrap" id="machine-wrap">
      <div class="machine" id="machine">
        <div class="roll-window">
          <div class="roll"></div>
          <div class="glass"></div>
        </div>
        <div class="m-groove" aria-hidden="true"></div>
        <div class="m-base">
          <div class="led" id="led"></div>
          <div class="vents" aria-hidden="true"></div>
        </div>
        <div class="m-slot">
          <div class="slot-mouth"></div>
          <div class="slot-lip"></div>
        </div>
      </div>
      <div class="machine-shadow" aria-hidden="true"></div>
    </div>

    <div class="out" id="out">
      <div class="slot" id="slot">
        <div class="paper-wrap" id="wrap">
          <canvas id="cv-paper" class="paper-canvas"></canvas>
          <canvas id="cv-ink" class="ink-canvas"></canvas>
        </div>
        <div class="head-line" id="head" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <footer class="dock">
    <p class="dock-about" id="dock-about">小票来了｜v1.0.1｜© 康康Ken</p>
    <div class="dock-row">
      <div id="dock-idle"><button class="btn-main" id="btn-print"><span>打 印</span></button></div>
      <div id="dock-done" class="dock-pair" hidden>
        <button class="btn-ghost" id="btn-save">存 图</button>
        <button class="btn-main btn-tear" id="btn-tear"><span>撕 下 来</span></button>
      </div>
    </div>
  </footer>

  <!-- ===== 开单面板 ===== -->
  <div class="sheet-mask" id="mask-new" hidden></div>
  <section class="sheet" id="sheet-new" hidden aria-label="开一张小票">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2>开一张小票</h2>
      <button class="sheet-close" id="close-new" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <span class="f-label">用哪个模板</span>
        <div class="tpl-row" id="tpl-row"></div>
      </div>
      <div id="form-fields"></div>
      <p class="sheet-tip" id="sheet-tip"></p>
    </div>
    <div class="sheet-foot">
      <button class="btn-main" id="btn-do-print"><span>打 印</span></button>
    </div>
  </section>

  <!-- ===== 小票操作 ===== -->
  <div class="sheet-mask" id="mask-act" hidden></div>
  <section class="sheet sheet-short" id="sheet-act" hidden aria-label="小票操作">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2>这张小票</h2>
      <button class="sheet-close" id="close-act" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <span class="f-label">导出比例</span>
        <div class="chips" id="ratio-chips"></div>
      </div>
      <div class="custom-ratio" id="custom-ratio" hidden>
        <input id="r-w" type="number" min="1" max="99" value="3" inputmode="numeric">
        <span>:</span>
        <input id="r-h" type="number" min="1" max="99" value="4" inputmode="numeric">
        <button class="chip" id="r-ok">用这个比例</button>
      </div>
      <div class="act-row">
        <button class="btn-ghost" id="act-share">分 享</button>
        <button class="btn-ghost" id="act-save">存 图</button>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn-main btn-tear" id="act-tear"><span>撕 下 来</span></button>
    </div>
  </section>

  <!-- ===== 票夹 ===== -->
  <div class="sheet-mask" id="mask-clip" hidden></div>
  <section class="sheet sheet-tall" id="sheet-clip" hidden aria-label="票夹">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2 id="clip-title">票夹 <span class="count" id="his-count"></span></h2>
      <div class="head-tools">
        <button class="link-btn" id="btn-trash">回收站</button>
        <button class="sheet-close" id="close-clip" aria-label="关闭">✕</button>
      </div>
    </div>
    <div class="sheet-body">
      <div id="clip-main">
        <input class="search-input" id="his-search" type="search" placeholder="搜客户、单号或金额" autocomplete="off">
        <div class="chips" id="cat-chips"></div>
      </div>
      <div id="trash-main" hidden>
        <p class="trash-note">删掉的小票会在这里放 7 天，过期自动清除。</p>
      </div>
      <div class="his-list" id="his-list"></div>
      <p class="his-empty" id="his-empty">还没有开过票</p>
    </div>
  </section>

  <!-- ===== 设置（全屏） ===== -->
  <div class="page" id="page-settings" hidden aria-label="设置">
    <header class="page-head">
      <h2>设置</h2>
      <button class="sheet-close" id="close-settings" aria-label="关闭">✕</button>
    </header>
    <div class="page-body" id="settings-body"></div>
  </div>

  <!-- ===== 模板编辑（全屏） ===== -->
  <div class="page" id="page-editor" hidden aria-label="编辑模板">
    <header class="page-head">
      <h2 id="editor-title">编辑模板</h2>
      <button class="sheet-close" id="close-editor" aria-label="关闭">✕</button>
    </header>
    <div class="page-body" id="editor-body"></div>
    <div class="page-foot">
      <button class="btn-ghost" id="editor-cancel">取 消</button>
      <button class="btn-main" id="editor-save"><span>保 存</span></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="assets/template.js"></script>
<script src="assets/receipt.js"></script>
<script src="assets/sound.js"></script>
<script src="assets/printer.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
